  exp4:
    name: "seq2_ft_s1"
    init_from: "seq1_s1"
    arm: "seq_ft"
    tag: "seq2_ft_s1"
    hyp: {epochs: 30, lr0: 0.0001, warmup_epochs: 0, patience: 30, seed: 1, save_period: 2}
