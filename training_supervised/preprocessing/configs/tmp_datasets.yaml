# tmp_datasets.yaml
#
# Dataset per la campagna SEQUENZIALE, su tmp_datasets/ - una copia di datasets/
# con due holdout in piu' ritagliati (f1tenth, squeaky). E' un SOVRAINSIEME di
# datasets.yaml: le sette voci originali restano, cosi' le 42 run gia' allenate
# continuano a risolvere i loro dataset quando run_preprocessing rigenera le
# references. Le sette voci nuove hanno prefisso seq_ e puntano a tmp_datasets/.
#
# Il parser legge SOLO datasets.yaml (ds_yaml_parser.py:4). Per usare questo
# file:   cp tmp_datasets.yaml datasets.yaml   (l'originale e' in git)
#
# I quattro task della sequenza:
#
#   1  public       seq_f1tenth (1998) + seq_huawei (514)               = 2512
#   2  squeaky lab  seq_squeaky_2M (1388) + seq_squeaky_1M (810)
#                   + seq_obj_neg (1165)                               = 3363
#   3  FIM outside  seq_FIM_outside (1605)                             = 1605
#   4  icra         seq_icra (2670)                                    = 2670
#
# objects_negatives e 1Macchina stanno nel task 2 perche' sono i negativi di
# quel laboratorio: un passo di soli negativi non e' un task (niente mAP, e
# ultralytics sceglierebbe best.pt su un fitness a zero).
#
# seq_FIM_outside e seq_icra puntano agli stessi split di datasets/: i loro
# holdout sono IDENTICI a quelli della tranche 2, e i confronti con joint_w100 e
# ftr_10 su quei due benchmark restano validi.

datasets:
  # --- campagna precedente, invariati (puntano a datasets/) --------------------
  dataset1:
    name: "f1tenth.v2i.yolov11"
    root: "/home/tm/Documents/universita/tirocinio_hipert/research/datasets/f1tenth.v2i.yolov11"
    type: "subfolders"

  dataset2:
    name: "huawei-uci2020-dataset"
    root: "/home/tm/Documents/universita/tirocinio_hipert/research/datasets/huawei-uci2020-dataset"
    type: "standard"

  dataset3:
    name: "squeaky_1Macchina"
    root: "/home/tm/Documents/universita/tirocinio_hipert/research/datasets/squeaky_17-04-26/squeaky_1Macchina"
