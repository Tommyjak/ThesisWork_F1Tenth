    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.3942}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.3942}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.3942}
    val_pct: 0.15
    seed: 42

  # ============================================================================
  # 50/50 - un negativo per positivo, il massimo praticabile.
  #
  # IDEA: 4234 negativi. Coincide con "tutti i negativi disponibili" entro il
  # rumore (4603, l'8.7% in piu'), quindi copre anche quella condizione. E' la
  # configurazione di ripiego se le quattro risultano indistinguibili.
  # ============================================================================

  exp7:
    name: "base_50_50_s1"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "50_50_s1"
    hyp: {epochs: 100, patience: 100, seed: 1, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 1.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 1.0}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 1.0}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 1.0}
    val_pct: 0.15
    seed: 42

  exp8:
    name: "base_50_50_s2"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "50_50_s2"
    hyp: {epochs: 100, patience: 100, seed: 2, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 1.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 1.0}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 1.0}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 1.0}
    val_pct: 0.15
    seed: 42

  exp9:
    name: "base_50_50_s3"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "50_50_s3"
    hyp: {epochs: 100, patience: 100, seed: 3, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 1.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 1.0}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 1.0}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 1.0}
    val_pct: 0.15
    seed: 42

  # ============================================================================
  # hard - QUALI negativi, non quanti.
  #
  # IDEA: 1815 negativi come 70/30, ma tutti dai due pool difficili - le scatole
  # di objects_negatives e le riprese 1Macchina senza annotazioni. Stessa
  # quantita', sorgente diversa: il confronto con base_70_30 isola la
  # provenienza. Se vince, i negativi difficili valgono piu' di quelli generici a
  # parita' di numero, e per una macchina da corsa - dove il falso positivo su un
  # cono o una scatola fa frenare - e' il risultato che conta di piu'.
  # ============================================================================

  exp10:
    name: "base_hard_s1"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "hard_s1"
    hyp: {epochs: 100, patience: 100, seed: 1, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.9188}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.9188}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.0}
    val_pct: 0.15
    seed: 42

  exp11:
    name: "base_hard_s2"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "hard_s2"
    hyp: {epochs: 100, patience: 100, seed: 2, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.9188}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.9188}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.0}
    val_pct: 0.15
    seed: 42

  exp12:
    name: "base_hard_s3"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "hard_s3"
    hyp: {epochs: 100, patience: 100, seed: 3, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.9188}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.9188}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.0}
    val_pct: 0.15
    seed: 42

  # ============================================================================
  # SECONDA TRANCHE - i bracci di continual learning, da base_50_50_s2.
  #
  # La base e' scelta per solidita', non per un criterio di prestazione: e' la
  # configurazione con la dispersione fra seed piu' bassa (sd media 0.0091), la
  # FAR piu' bassa e piu' stretta (0.0779 +/- 0.0026 su FIM_outside_holdout), e
  # il pool di negativi completo - quindi il buffer di replay e' un campione di
  # tutto cio' che esiste, non di un sottoinsieme. s2 e' la replica MEDIANA su
  # mAP50 (0.9242 / 0.9266 / 0.9413): non la migliore, quella rappresentativa.
  #
  # NOTA SUL NOME: "50_50" e' stata allenata con neg_ratio 1.0, quindi ha preso
  # tutti i 4603 negativi -> 52/48. In tesi si chiama "full".
  #
  # --- UN SOLO SCALARE PER CURVA ---------------------------------------------
  #
  # Tre curve, ciascuna varia UNA cosa e tiene ferme le altre:
  #
  #   joint    da yolo26n,       100 ep   varia la quota del VECCHIO conservata
  #   ft       da base_50_50_s2,  30 ep   varia la quota di ICRA usata
  #   replay   da base_50_50_s2,  30 ep   varia il buffer del VECCHIO
  #
  # I punti sono a decadi (2 / 10 / 50 / 100 %), non ravvicinati: il pilota ha
  # mostrato che punti vicini (d25 vs d50, delta 0.018) non sono risolvibili
  # con sd 0.010.
  #
  # --- LE COPPIE APPAIATE, il confronto piu' pulito della campagna -----------
  #
  # joint_wXX e ftr_XX vedono ESATTAMENTE gli stessi dati: XX% del vecchio + tutto
  # ICRA. L'unica differenza e' il punto di partenza - yolo26n contro il
  # checkpoint della base. Tre coppie (2%, 10%, 50%) rispondono a "riparto da
  # zero o continuo?" a parita' di dati, e la colonna del tempo dice quanto costa
  # ciascuna risposta: il joint fa 100 epoche, il replay 30.
  #
  # Il joint tiene 100 epoche anche con il 2% dei dati: e' il braccio "da zero"
  # e il suo costo E' la misura. Abbassargli le epoche truccherebbe l'asse del
  # tempo a suo favore.
  #
  # --- TRE SEED ------------------------------------------------------------
  #
  # Il confronto e' a base condivisa e gli effetti attesi sono 12x il rumore fra
  # seed sul dominio vecchio: due repliche basterebbero. La terza serve a
  # icra_holdout, dove il rumore di trasferimento e' 4x piu' grande (sd 0.044
  # sulla mAP50 delle basi) e due punti non bastano a stimare una deviazione
  # con cui si possa dire qualcosa. Costa il 50% in piu'; vale la tranquillita'.
  #
  # Convenzione per analysis.py: il seed 1 porta l'arm canonico e il tag "main"
  # (o il tag della curva); i seed 2 e 3 portano arm "seed_rep". Cosi' nessuna
  # cella (arm, tag) ha due righe, e l'aggregazione media +/- sd e' esplicita
  # nei gruppi per nome di run in SEED_GROUPS.
  #
  # --- IL SEQUENZIALE NON C'E' -----------------------------------------------
  #
  # Rinviato: richiede un holdout per ogni task della sequenza (f1tenth,
  # squeaky, FIM_outside, icra) per riempire la matrice R dopo ogni passo, e
  # quindi una struttura dei dataset diversa da quella con cui sono state
  # allenate le basi. Sara' una terza tranche.
  #
  # --- COSTO su forrester (6.05 ms/img/epoca / 1.4) ---------------------------
  #
  #   joint  w100 11507 img x100 ep x3 seed   4h 09
  #          w50   7088                       2h 33
  #          w10   3552                       1h 17
  #          w2    2846                       1h 02
  #   ft     d100  2670 x30 x3                  17 min
  #          d50   1335                          9 min
  #          d10    267                          2 min
  #   replay  50   7088 x30 x3                  46 min
  #          10   3552                          23 min
  #           2   2846                          18 min
  #                                    -------------
  #   30 run                                 ≈ 10h 55
  # ============================================================================

  # --- joint: quanto vale riallenare tutto da zero ------------------------------

  # IDEA: il retrain completo alle proporzioni naturali. Tetto teorico e riferimento
  # dell'intransigence. 11507 immagini per 100 epoche: l'avversario piu' caro.
  exp13:
    name: "joint_w100_s1"
    model: 'yolo26n.pt'
    arm: "joint"
    tag: "main"
    hyp: {epochs: 100, patience: 100, seed: 1, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 1.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 1.0}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 1.0}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 1.0}
      icra_base:                  {pos_ratio: 1.0, neg_ratio: 1.0}
    val_pct: 0.15
    seed: 42
  exp14:
    name: "joint_w100_s2"
    model: 'yolo26n.pt'
    arm: "seed_rep"
    tag: "joint_w100_s2"
    hyp: {epochs: 100, patience: 100, seed: 2, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 1.0}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 1.0}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 1.0}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 1.0}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 1.0}
      icra_base:                  {pos_ratio: 1.0, neg_ratio: 1.0}
    val_pct: 0.15
    seed: 42
  exp15:
