      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.1022}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.1022}
    val_pct: 0.15
    seed: 42

  exp3:
    name: "base_90_10_s3"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "90_10_s3"
    hyp: {epochs: 100, patience: 100, seed: 3, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.1022}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.1022}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.1022}
    val_pct: 0.15
    seed: 42

  # ============================================================================
  # 70/30 - il punto intermedio, e il termine di paragone di base_hard.
  #
  # IDEA: 1815 negativi, neg:pos 0.429. E' l'unica configurazione che ha un
  # gemello per composizione (base_hard, stessa quantita' da sorgenti diverse),
  # quindi porta due informazioni invece di una.
  # ============================================================================

  exp4:
    name: "base_70_30_s1"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "70_30_s1"
    hyp: {epochs: 100, patience: 100, seed: 1, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.3942}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.3942}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.3942}
    val_pct: 0.15
    seed: 42

  exp5:
    name: "base_70_30_s2"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "70_30_s2"
    hyp: {epochs: 100, patience: 100, seed: 2, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.3942}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.3942}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.3942}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.3942}
