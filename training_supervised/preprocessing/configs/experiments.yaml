# experiments.yaml
#
# PRIMA TRANCHE della campagna definitiva: solo l'asse dei negativi della base.
#
# Quattro configurazioni, tre repliche di seed ciascuna, dodici run. I bracci di
# continual learning NON sono qui: il loro init_from e' il vincitore di questa
# tranche, che ancora non si conosce. Si aggiungono dopo il benchmark.
#
# --- PERCHE' TRE REPLICHE ------------------------------------------------------
#
# Non e' prudenza, e' la condizione perche' l'esperimento misuri qualcosa. Lo
# studio pilota (results_pilot, 37 run) ha confrontato la dispersione FRA quattro
# basi diverse con quella FRA quattro repliche della stessa base:
#
#   benchmark              metrica        sd fra basi  sd repliche  rapporto
#   FIM_outside_holdout    mAP50               0.0234       0.0019     12.3x
#   FIM_outside_holdout    mAP50-95            0.0101       0.0097      1.0x
#   FIM_outside_holdout    FAR                 0.0317       0.0207      1.5x
#   FIM_inside             mAP50               0.0104       0.0114      0.9x
#   FIM_inside             FAR                 0.0418       0.0121      3.5x
#   icra_holdout           mAP50               0.0692       0.0637      1.1x
#
# Su sette combinazioni su nove le basi sono INDISTINGUIBILI dal rumore di un
# seed singolo. Con una run per configurazione questo esperimento non misurerebbe
# la composizione dei negativi: misurerebbe la fortuna. Nel pilota e' successo
# davvero - base_balanced prese un seed che su icra_holdout la portava a 4.4
# deviazioni dalla media delle sue tre repliche.
#
# Servono circa 8*sigma^2/d^2 run per risolvere le differenze osservate: ~4 sulla
# mAP50-95, ~2 sulla FAR. Tre e' il compromesso.
#
# --- LA SCALA ------------------------------------------------------------------
#
# Pool disponibile: 4234 positivi, 4603 negativi. Il rapporto neg:pos massimo e'
# quindi 1.087, e questo vincola la scala piu' di quanto sembri: "50/50" e "tutti
# i negativi" distano l'8.7%, cioe' sono la stessa condizione. "full" non compare
# per questo - si riporta come nota, coincide con 50/50 entro il rumore.
#
#   90/10   470 negativi    neg:pos 0.111
#   70/30  1815 negativi    neg:pos 0.429
#   50/50  4234 negativi    neg:pos 1.000
#
# Quasi una decade fra il primo e il terzo. Tutte le sorgenti di negativi sono
# scalate con lo STESSO fattore: quanti negativi e quali negativi sono due
# domande diverse, e la seconda e' base_hard.
#
# --- SU base_hard: quantita' pareggiata, non pool intero -----------------------
#
# Il pool difficile (objects_negatives 1165 + squeaky_1Macchina 810) vale 1975
# immagini, cioe' neg:pos 0.466. Usarlo tutto lo metterebbe fra 70/30 (0.429) e
# 50/50, e il confronto con 70/30 mescolerebbe due variabili: 9% di negativi in
# piu' E una provenienza diversa.
#
# Qui e' invece sottocampionato a 1815, esattamente la quantita' di 70/30. Cosi'
# base_hard e base_70_30 differiscono per UNA sola cosa - da dove vengono i
# negativi - e il confronto e' pulito. Costa 160 immagini di negativi difficili
# non usate; vale il fatto che il risultato diventi interpretabile.
#
# --- COSA VA FATTO PRIMA DI LANCIARE -------------------------------------------
#
#   1. archiviare il pilota:  results -> results_pilot
#                             evaluation/ledger.jsonl -> pilot_ledger.jsonl
#                             evaluation/predictions -> pilot_predictions
#      benchmark.py:50 assegna arm='baseline' a ogni run che non trova in
#      get_exp_meta(). Le 37 run del pilota non sono piu' definite qui, quindi
#      restando in results/ verrebbero tutte ri-etichettate come baseline.
#
#   2. le definizioni del pilota sono in lucky_experiments.yaml, non cancellarle:
#      servono se un giorno vuoi ri-analizzare quei risultati.
#
# --- CRITERIO DI SELEZIONE, fissato ORA e non dopo aver visto i numeri ---------
#
#   Vince la configurazione con la mAP50 piu' alta su FIM_outside_holdout,
#   mediata sulle tre repliche.
#
#   mAP50 e non mAP50-95: e' l'unica metrica con rapporto 12.3x. La mAP50-95 sta
#   a 1.0x e sceglierci sopra sarebbe un sorteggio. Mai su icra_holdout: sarebbe
#   selezione sul dominio che i bracci devono ancora imparare.
#
#   Prosegue la replica MEDIANA della configurazione vincente, non la migliore.
#   Prendere la migliore reintrodurrebbe esattamente il bias che le repliche
#   servono a togliere.
#
#   Se le configurazioni risultano indistinguibili - esito probabile, viste le
#   varianze del pilota - non c'e' un vincitore: ci si pre-impegna sul 50/50 e si
#   riporta il risultato nullo, che con tre repliche e' un'affermazione sostenuta
#   e non un'assenza di dati.
#
# --- COSTO ---------------------------------------------------------------------
#
#   90/10   4704 img   47 min       per seed  4h 15
#   70/30   6049 img   61 min       x3 seed  12h 44
#   50/50   8468 img   85 min
#   hard    6049 img   61 min       + ~20 min di benchmark sulle 12 run
#
# --- NOTE DI FORMATO -----------------------------------------------------------
#
# Il seed sta dentro hyp: e' l'unico punto da cui raggiunge model.train(). Il
# campo seed a livello di esperimento governa solo il campionamento dei dati, e
# con pos_ratio/neg_ratio identici fra repliche non cambierebbe nulla.
#
# patience = epochs, cioe' early stopping disattivato: le dodici run devono avere
# lo stesso budget di ottimizzazione, altrimenti si fermano su criteri diversi.
#
# tag distinto per replica (90_10_s1, 90_10_s2, ...) perche' scalar() in
# analysis.py alza ValueError se una cella (arm, tag) ha piu' di una riga.
# L'aggregazione sulle repliche e' esplicita in BASE_REPLICAS, non implicita in
# un pivot che farebbe una media silenziosa.

experiments:

  # ============================================================================
  # 90/10 - il minimo di negativi.
  #
  # IDEA: quanto in basso si puo' scendere prima che i falsi allarmi diventino
  # ingestibili? 470 negativi contro 4234 positivi. E' l'estremo che dice se i
  # negativi servano davvero o siano soprattutto zavorra.
  # ============================================================================

  exp1:
    name: "base_90_10_s1"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "90_10_s1"
    hyp: {epochs: 100, patience: 100, seed: 1, save_period: 2}
    datasets:
      f1tenth.v2i.yolov11:        {pos_ratio: 1.0, neg_ratio: 0.1022}
      huawei-uci2020-dataset:     {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_2Macchine:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      squeaky_1Macchina:          {pos_ratio: 1.0, neg_ratio: 0.1022}
      objects_negatives_15-05-26: {pos_ratio: 1.0, neg_ratio: 0.1022}
      FIM_outside_base:           {pos_ratio: 1.0, neg_ratio: 0.1022}
    val_pct: 0.15
    seed: 42

  exp2:
    name: "base_90_10_s2"
    model: 'yolo26n.pt'
    arm: "base"
    tag: "90_10_s2"
    hyp: {epochs: 100, patience: 100, seed: 2, save_period: 2}
    datasets:
